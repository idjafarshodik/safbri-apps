<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Safety Briefing ULTG Sampang</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { pln: { main: '#14a2ba', dark: '#125d72', bg: '#f4f7f8', soft: '#eaf5f8', border: '#e1e8eb', text: '#16232b', muted: '#5b7280' } },
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
          boxShadow: { 'kahoot': '0 6px 0 rgba(0,0,0,0.1)' }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen text-pln-text bg-pln-bg flex flex-col items-center p-4 pt-12 md:pt-16">

  <div class="w-full max-w-md mb-8 flex flex-col items-center">
    <h1 class="text-2xl font-extrabold text-pln-dark mb-8 tracking-wide text-center">
      SAFBRI ULTG SAMPANG
    </h1>
    <div class="w-full">
      <div class="flex justify-between text-xs font-bold text-pln-muted mb-2 tracking-wide uppercase">
        <span>Langkah <span id="current-step-indicator">1</span> dari 4</span>
        <span id="step-title">Data Pekerjaan</span>
      </div>
      <div class="w-full bg-gray-200 rounded-full h-2.5">
        <div id="progress-bar" class="bg-pln-main h-2.5 rounded-full transition-all duration-300 ease-out" style="width: 25%"></div>
      </div>
    </div>
  </div>

  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg border border-[#edf2f4] overflow-hidden relative min-h-[480px]">
    <form id="safetyForm">
      
      <div id="step-1" class="step-card active p-6 md:p-8">
        <h2 class="text-xl font-extrabold text-pln-dark mb-6 text-center">Data Pekerjaan</h2>
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-bold text-pln-muted mb-1">Nama Pekerjaan</label>
            <input id="nama_pekerjaan" type="text" class="kahoot-input w-full" placeholder="Contoh: Pemeliharaan Bay Trafo..." required />
          </div>
          <div>
            <label class="block text-sm font-bold text-pln-muted mb-1">Tanggal Pekerjaan</label>
            <input id="tanggal_pekerjaan" type="text" class="kahoot-input w-full bg-white" placeholder="Pilih Tanggal" required />
          </div>
          <div>
            <label class="block text-sm font-bold text-pln-muted mb-1">Lokasi Pekerjaan</label>
            <input id="lokasi" type="text" class="kahoot-input w-full" placeholder="Contoh: GI Sampang" required />
          </div>
        </div>
        <button type="button" onclick="nextStep(2)" class="btn-kahoot w-full mt-8 bg-pln-main text-white">Lanjut Ke Pelaksana ➔</button>
      </div>

      <div id="step-2" class="step-card p-6 md:p-8">
        <h2 class="text-xl font-extrabold text-pln-dark mb-6 text-center">Data Pelaksana</h2>
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-bold text-pln-muted mb-1">Tim Pelaksana / Vendor</label>
            <input id="tim_pelaksana" type="text" class="kahoot-input w-full" required />
          </div>
          <div>
            <label class="block text-sm font-bold text-pln-muted mb-1">Pengawas K3</label>
            <input id="pengawas_k3" type="text" class="kahoot-input w-full" required />
          </div>
          <div>
            <label class="block text-sm font-bold text-pln-muted mb-1">Pengawas Pekerjaan</label>
            <input id="pengawas_pekerjaan" type="text" class="kahoot-input w-full" required />
          </div>
          <div>
            <label class="block text-sm font-bold text-pln-muted mb-1">Jumlah Pelaksana</label>
            <input id="jumlah_pelaksana" type="number" min="1" class="kahoot-input w-full" placeholder="Berapa orang?" required />
          </div>
        </div>
        <div class="flex gap-3 mt-8">
          <button type="button" onclick="prevStep(1)" class="btn-kahoot w-1/3 bg-gray-200 text-gray-700">Kembali</button>
          <button type="button" onclick="nextStep(3)" class="btn-kahoot w-2/3 bg-pln-main text-white">Lanjut Ke Foto WP ➔</button>
        </div>
      </div>

      <div id="step-3" class="step-card p-6 md:p-8 h-full">
        <h2 class="text-xl font-extrabold text-pln-dark mb-2 text-center">Foto Working Permit</h2>
        <p class="text-center text-sm text-pln-muted mb-4">Pastikan dokumen terbaca dengan jelas.</p>
        
        <div class="media-container relative bg-black rounded-xl overflow-hidden flex-1 min-h-[250px] mb-4 flex items-center justify-center">
          <video id="video-WP" class="absolute inset-0 w-full h-full object-cover hidden" autoplay playsinline></video>
          <img id="preview-WP" class="absolute inset-0 w-full h-full object-contain hidden z-10 bg-white" />
          
          <div id="guide-WP" class="absolute inset-y-2 inset-x-12 md:inset-x-20 border-2 border-dashed border-white/70 rounded-lg pointer-events-none hidden z-0 flex items-center justify-center">
            <span class="bg-black/60 text-white text-[10px] px-3 py-1 rounded-full backdrop-blur-sm text-center">Posisikan Kertas Disini<br/>(Portrait)</span>
          </div>
          
          <div id="init-ui-WP" class="z-10 flex flex-col items-center gap-3 w-full px-4">
            <button type="button" onclick="startCamera('WP')" class="btn-kahoot w-full bg-blue-600 text-white text-sm">📸 Gunakan Kamera Live</button>
            <div class="relative w-full text-center">
              <span class="bg-black text-white/50 text-xs px-2 relative z-10">ATAU</span>
              <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-white/20"></div></div>
            </div>
            <label class="btn-kahoot w-full bg-gray-700 text-white text-sm cursor-pointer text-center block">
              📁 Pilih Dari Galeri
              <input id="file-WP" type="file" accept="image/*" class="hidden" onchange="handleFile(this, 'WP')" />
            </label>
          </div>
          
          <button type="button" id="snap-btn-WP" onclick="takeSnapshot('WP')" class="absolute bottom-4 left-1/2 -translate-x-1/2 w-14 h-14 bg-white rounded-full border-4 border-gray-300 shadow-lg hidden z-20 active:scale-90 transition-transform"></button>
          <button type="button" id="retake-btn-WP" onclick="resetMedia('WP')" class="absolute top-3 right-3 bg-red-500 text-white text-xs px-3 py-1 rounded-full font-bold hidden z-20 shadow-md">Ulangi</button>
        </div>

        <div class="flex gap-3 mt-auto">
          <button type="button" onclick="prevStep(2)" class="btn-kahoot w-1/3 bg-gray-200 text-gray-700">Kembali</button>
          <button type="button" onclick="nextStep(4, 'WP')" class="btn-kahoot w-2/3 bg-pln-main text-white">Lanjut ➔</button>
        </div>
      </div>

      <div id="step-4" class="step-card p-6 md:p-8 h-full">
        <h2 class="text-xl font-extrabold text-pln-dark mb-2 text-center">Foto Safety Briefing</h2>
        <p class="text-center text-sm text-pln-muted mb-4">Pastikan seluruh tim masuk ke dalam frame.</p>
        
        <div class="media-container relative bg-black rounded-xl overflow-hidden flex-1 min-h-[250px] mb-4 flex items-center justify-center">
          <video id="video-SB" class="absolute inset-0 w-full h-full object-cover hidden" autoplay playsinline></video>
          <img id="preview-SB" class="absolute inset-0 w-full h-full object-contain hidden z-10 bg-white" />
          
          <div id="guide-SB" class="absolute inset-x-2 inset-y-16 md:inset-y-20 border-2 border-dashed border-white/70 rounded-lg pointer-events-none hidden z-0 flex items-center justify-center">
            <span class="bg-black/60 text-white text-[10px] px-3 py-1 rounded-full backdrop-blur-sm text-center">Posisikan Tim Disini<br/>(Landscape)</span>
          </div>
          
          <div id="init-ui-SB" class="z-10 flex flex-col items-center gap-3 w-full px-4">
            <button type="button" onclick="startCamera('SB')" class="btn-kahoot w-full bg-blue-600 text-white text-sm">📸 Gunakan Kamera Live</button>
            <div class="relative w-full text-center">
              <span class="bg-black text-white/50 text-xs px-2 relative z-10">ATAU</span>
              <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-white/20"></div></div>
            </div>
            <label class="btn-kahoot w-full bg-gray-700 text-white text-sm cursor-pointer text-center block">
              📁 Pilih Dari Galeri
              <input id="file-SB" type="file" accept="image/*" class="hidden" onchange="handleFile(this, 'SB')" />
            </label>
          </div>
          
          <button type="button" id="snap-btn-SB" onclick="takeSnapshot('SB')" class="absolute bottom-4 left-1/2 -translate-x-1/2 w-14 h-14 bg-white rounded-full border-4 border-gray-300 shadow-lg hidden z-20 active:scale-90 transition-transform"></button>
          <button type="button" id="retake-btn-SB" onclick="resetMedia('SB')" class="absolute top-3 right-3 bg-red-500 text-white text-xs px-3 py-1 rounded-full font-bold hidden z-20 shadow-md">Ulangi</button>
        </div>

        <div class="flex gap-3 mt-auto">
          <button type="button" onclick="prevStep(3)" class="btn-kahoot w-1/3 bg-gray-200 text-gray-700">Kembali</button>
          <button type="submit" id="submitBtn" class="btn-kahoot w-2/3 bg-green-500 text-white border-green-600">KIRIM LAPORAN ✔</button>
        </div>
      </div>

    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
